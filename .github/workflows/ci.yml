name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Protoc Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Verify Protobuf Generation & Drift
        run: make proto-check-drift

      - name: Formatting & Drift Check
        run: |
          make fmt
          git diff --exit-code || (echo "Code has unformatted files. Run 'make fmt'" && exit 1)

      - name: Lint & Static Analysis
        run: make lint

      - name: Build Verification (Zero CGO)
        run: make build

  unit-tests:
    name: Unit & Integration Tests (Zero CGO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Test Suite (CGO_ENABLED=0)
        run: make test

      - name: Run Race Detector
        run: go test -race -v ./test/...

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run OSV-Scanner
        run: make vuln-scan
